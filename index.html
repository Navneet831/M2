        const hexToRgb = (hex) => {
            if (!hex || hex.length !== 7) return { r: 0, g: 0, b: 0 };
            let c = hex.substring(1);
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            return {
                r: parseInt(c.substring(0, 2), 16) || 0,
                g: parseInt(c.substring(2, 4), 16) || 0,
                b: parseInt(c.substring(4, 6), 16) || 0
            };
        };

        const rgbToHex = (r, g, b) => {
            const clamp = (val) => Math.max(0, Math.min(Math.round(val), 255));
            return "#" + [clamp(r), clamp(g), clamp(b)].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join("").toUpperCase();
        };

        const hexToHsl = (hex) => {
            const { r, g, b } = hexToRgb(hex);
            const rPercent = r / 255;
            const gPercent = g / 255;
            const bPercent = b / 255;

            const max = Math.max(rPercent, gPercent, bPercent);
            const min = Math.min(rPercent, gPercent, bPercent);
            let h = 0, s = 0, l = (max + min) / 2;

            if (max !== min) {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case rPercent: h = (gPercent - bPercent) / d + (gPercent < bPercent ? 6 : 0); break;
                    case gPercent: h = (bPercent - rPercent) / d + 2; break;
                    case bPercent: h = (rPercent - gPercent) / d + 4; break;
                }
                h /= 6;
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        };

        const getOptimalTextColor = (hex) => {
            if (!hex || hex.length !== 7) return '#FFFFFF';
            const rgb = hexToRgb(hex);
            const lum = getLuminance(rgb.r, rgb.g, rgb.b);
            const contrastWhite = (1 + 0.05) / (lum + 0.05);
            const contrastBlack = (lum + 0.05) / (0.015 + 0.05);
            return contrastWhite > contrastBlack ? '#FFFFFF' : '#111827';
        };

        const getLuminance = (r, g, b) => {
            const [rs, gs, bs] = [r/255, g/255, b/255].map(c => 
                c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
            );
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        };

        const getHarmonyCategory = (hex) => {
            const { h, s, l } = hexToHsl(hex);

            if (h >= 330 || h < 20) return "Complementary Red Harmonies";
            if (h >= 20 && h < 50) return "Analogous Orange & Gold tones";
            if (h >= 50 && h < 80) return "Analogous Yellow & Amber tones";
            if (h >= 80 && h < 165) return "Triadic Green & Mint harmonies";
            if (h >= 165 && h < 255) return "Complementary Blue & Cyan tones";

        const ColorCard = ({ color, onDelete, onEdit }) => {
            const [copied, setCopied] = useState(false);
            const textColor = getOptimalTextColor(color.primary);

            const handleCopy = (e) => {
                e.stopPropagation();
                let copyVal = "";
                if (!color.secondary || color.secondary === color.primary) {
                    copyVal = color.primary;
                } else {
                    copyVal = `linear-gradient(135deg, ${color.primary}, ${color.secondary})`;
                }
                
                const el = document.createElement('textarea');
                el.value = copyVal;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);

                setCopied(true);
                setTimeout(() => setCopied(false), 1500);
            };

            const getCardBackground = () => {
                if (!color.secondary || color.secondary === color.primary) {
                    return color.primary;
                }
                return `linear-gradient(135deg, ${color.primary}, ${color.secondary})`;
            };

            return (
                <div 
                    onClick={handleCopy}
                    className="color-card group relative h-28 w-full rounded-xl cursor-pointer flex flex-col justify-between p-3 border border-black/5 dark:border-white/10"
                    style={{ background: getCardBackground(), color: textColor }}
                    role="button"

                    aria-label={`Copy color definition for ${color.name}`}

                                    <Icon name="edit" size={12} />
                                </button>

                setNewName(color.name);
                setNewPrimary(color.primary);
                setNewSecondary(color.secondary === color.primary ? '' : color.secondary);
                setNewGroup(color.group);
                setShowAddModal(true);
            };

            // Color saving (supports both adding new and saving edits)
            const handleSaveColor = async (e) => {
                e.preventDefault();

                if (newPrimary.length !== 7) {
                    showToast("Please enter a valid 7-character primary color hex code.", "error");
                    return;
                }
                if (newSecondary && newSecondary.length !== 7) {
                    showToast("Please enter a valid 7-character secondary color hex code or clear it.", "error");
                    return;
                }

                const finalGroup = newGroup || classifyLayoutGroup(newPrimary);

                if (editingColor) {
                    if (editingColor.id.startsWith("sys-")) {
                        const updatedDeleted = [...deletedSysIds, editingColor.id];
                        setDeletedSysIds(updatedDeleted);
                        const storageKey = user ? (DELETED_SYS_DB_KEY + "_" + user.uid) : DELETED_SYS_DB_KEY;
                        localStorage.setItem(storageKey, JSON.stringify(updatedDeleted));
                        if (firestoreDb && user) {
                            try {
                                await firestoreDb.collection("users").doc(user.uid).collection("settings").doc("deleted_sys").set({ ids: updatedDeleted });
                            } catch (e) {
                                console.error(e);
                            }
                        }

                        const newRef = {
                            id: "color-" + Date.now(),
                            name: newName,
                            primary: newPrimary,
                            secondary: newSecondary || newPrimary,
                            group: finalGroup,
                            createdAt: Date.now(),
                            userId: user ? user.uid : "sandbox"
                        };

                        if (firestoreDb && user) {
                            try {
                                await firestoreDb.collection("colors").doc(newRef.id).set(newRef);
                                showToast("Default color modified and saved to Cloud.", "success");
                            } catch (err) {
                                saveLocal(newRef);
                                showToast("Saved modification locally.", "success");
                            }
                        } else {
                            saveLocal(newRef);
                            showToast("Saved modification locally.", "success");
                        }
                    } else {
                        const updatedRef = {
                            ...editingColor,
                            name: newName,
                            primary: newPrimary,
                            secondary: newSecondary || newPrimary,
                            group: finalGroup,
                            createdAt: editingColor.createdAt || Date.now(), // Preserve timestamp
                            updatedAt: Date.now(),
                            userId: user ? user.uid : (editingColor.userId || "sandbox")
                        };

                        if (firestoreDb && user) {
                            try {
                                await firestoreDb.collection("colors").doc(editingColor.id).set(updatedRef);
                                showToast("Color reference updated in Cloud.", "success");
                            } catch (err) {
                                updateLocal(updatedRef);
                                showToast("Updated locally.", "success");
                            }
                        } else {
                            updateLocal(updatedRef);
                            showToast("Updated locally.", "success");
                        }
                    }
                } else {
                    const newRef = {
                        id: "color-" + Date.now(),
                        name: newName,
                        primary: newPrimary,
                        secondary: newSecondary || newPrimary,
                        group: finalGroup,
                        createdAt: Date.now(),
                        userId: user ? user.uid : "sandbox"
                    };

                    if (firestoreDb && user) {
                        try {
                            await firestoreDb.collection("colors").doc(newRef.id).set(newRef);
                            showToast("Saved to Cloud Firestore.", "success");
                        } catch (err) {
                            saveLocal(newRef);
                            showToast("Failed to write to Cloud. Saved locally.", "error");
                        }
                    } else {
                        saveLocal(newRef);
                        showToast("Saved to local sandbox.", "success");
                    }
                }

                setNewName('');
                setNewPrimary('#');
                setNewSecondary('');
                setEditingColor(null);
                setShowAddModal(false);
                loadDatabase();
            };

            const saveLocal = (ref) => {
                const raw = localStorage.getItem(OFFLINE_DB_KEY);
                const current = raw ? JSON.parse(raw) : [];
                current.push(ref);
                localStorage.setItem(OFFLINE_DB_KEY, JSON.stringify(current));
            };

            const updateLocal = (updatedRef) => {
                const raw = localStorage.getItem(OFFLINE_DB_KEY);
                if (raw) {
                    const current = JSON.parse(raw);
                    const idx = current.findIndex(c => c.id === updatedRef.id);
                    if (idx !== -1) {
                        current[idx] = updatedRef;
                        localStorage.setItem(OFFLINE_DB_KEY, JSON.stringify(current));
                    }
                }
            };

            const handleDeleteColor = async (id) => {
                if (id.startsWith("sys-")) {
                    const updatedDeleted = [...deletedSysIds, id];
                    setDeletedSysIds(updatedDeleted);
                    const storageKey = user ? (DELETED_SYS_DB_KEY + "_" + user.uid) : DELETED_SYS_DB_KEY;
                    localStorage.setItem(storageKey, JSON.stringify(updatedDeleted));
                    
                    if (firestoreDb && user) {
                        try {
                            await firestoreDb.collection("users").doc(user.uid).collection("settings").doc("deleted_sys").set({ ids: updatedDeleted });
                            showToast("Removed default color reference.", "info");
                        } catch (e) {
                            console.error("Firestore deleted sys save error:", e);
                            showToast("Removed locally only.", "info");
                        }
                    } else {
                        showToast("Removed locally.", "info");
                    }
                } else {
                    if (firestoreDb && user) {
                        try {
                            await firestoreDb.collection("colors").doc(id).delete();
                            showToast("Deleted from Cloud Firestore.", "info");
                        } catch (e) {
                            console.error("Firestore delete failure:", e);
                            deleteLocal(id);
                            showToast("Deleted from local backup.", "info");
                        }
                    } else {
                        deleteLocal(id);
                        showToast("Deleted from local sandbox.", "info");
                    }
                }
                loadDatabase();
            };

            const deleteLocal = (id) => {
                const raw = localStorage.getItem(OFFLINE_DB_KEY);
                if (raw) {
                    const current = JSON.parse(raw);
                    const filtered = current.filter(c => c.id !== id);
                    localStorage.setItem(OFFLINE_DB_KEY, JSON.stringify(filtered));
                }
            };

            const handleSaveDb = (e) => {
                e.preventDefault();
                localStorage.setItem(DB_CONFIG_KEY, JSON.stringify(dbConfig));
                setShowDbModal(false);
                showToast("Connection settings updated.", "success");
                loadDatabase();
            };

            // Sorting, grouping, and filters
            const groupedColorData = useMemo(() => {
                const activeSystem = SYSTEM_COLORS.filter(sys => !deletedSysIds.includes(sys.id));
                const allColors = [...activeSystem, ...colors];

                let filtered = allColors.filter(c => 
                    c.name.toLowerCase().includes(search.toLowerCase()) ||
                    c.primary.toLowerCase().includes(search.toLowerCase()) ||
                    (c.secondary && c.secondary.toLowerCase().includes(search.toLowerCase()))
                );

                // Chronological & Alphabetical Sorting
                if (sortBy === 'NEW_TO_OLD') {
                    filtered.sort((a, b) => b.createdAt - a.createdAt);
                } else if (sortBy === 'OLD_TO_NEW') {
                    filtered.sort((a, b) => a.createdAt - b.createdAt);
                } else if (sortBy === 'NAME_ASC') {
                    filtered.sort((a, b) => a.name.localeCompare(b.name));
                } else if (sortBy === 'NAME_DESC') {
                    filtered.sort((a, b) => b.name.localeCompare(a.name));
                }

                if (sortMode === 'LAYOUT') {
                    const matrix = Object.values(LAYOUT_GROUPS).map(groupName => ({
                        group: groupName,
                        colors: []
                    }));

                    filtered.forEach(color => {
                        const match = matrix.find(m => m.group === color.group);
                        if (match) match.colors.push(color);
                    });

                    return matrix.filter(m => m.colors.length > 0);
                } else {
                    const harmonyMatrix = [
                        { group: "Complementary Red Harmonies", colors: [] },
                        { group: "Analogous Orange & Gold tones", colors: [] },
                        { group: "Analogous Yellow & Amber tones", colors: [] },
                        { group: "Triadic Green & Mint harmonies", colors: [] },
                        { group: "Complementary Blue & Cyan tones", colors: [] },
                        { group: "Triadic Purple & Violet sets", colors: [] },
                        { group: "Monochrome & Neutral tones", colors: [] }
                    ];

                    filtered.forEach(color => {
                        const category = getHarmonyCategory(color.primary);
                        const match = harmonyMatrix.find(h => h.group === category);
                        if (match) {
                            match.colors.push(color);
                        } else {
                            harmonyMatrix[harmonyMatrix.length - 1].colors.push(color);
                        }
                    });

                    return harmonyMatrix.filter(h => h.colors.length > 0);
                }
            }, [colors, deletedSysIds, search, sortMode, sortBy]);

            const activeSystemCount = SYSTEM_COLORS.length - deletedSysIds.length;
            const totalCount = activeSystemCount + colors.length;
            const visibleCount = groupedColorData.reduce((acc, s) => acc + s.colors.length, 0);

            // Check if preview background is ready
            const getPreviewBg = () => {
                const isValidPrimary = newPrimary && newPrimary.length === 7;
                const isValidSecondary = newSecondary && newSecondary.length === 7;
                if (!isValidPrimary) return 'transparent';
                if (isValidSecondary) {
                    return `linear-gradient(135deg, ${newPrimary}, ${newSecondary})`;
                }
                return newPrimary;
            };

            return (
                <div className="min-h-screen pb-20 selection:bg-emerald-500 selection:text-white transition-colors duration-300">
                    
                    {/* APP NAVBAR */}
                    <header className="sticky top-0 z-50 bg-[#F0F2F5]/80 dark:bg-[#0A0A0A]/85 backdrop-blur-md border-b border-gray-200 dark:border-white/5 shadow-sm px-6 h-16 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-emerald-600 rounded flex items-center justify-center text-white font-bold text-sm shadow-inner">
                                FC
                            </div>
                            <div>
                                <h1 className="text-sm font-bold tracking-tight">Layout & Harmony Color Matrix</h1>
                                <p className="text-[9px] text-gray-500 dark:text-gray-400 font-mono uppercase tracking-widest">Financial Interface Reference Guide</p>
                            </div>
                        </div>

                        {/* Search, Auth and Database Tools */}
                        <div className="flex items-center gap-4">
                            <div className="relative hidden md:block">
                                <input 
                                    type="text" 
                                    placeholder="Filter layout gradients..." 
                                    value={search}
                                    onChange={(e) => setSearch(e.target.value)}
                                    className="text-xs bg-white dark:bg-[#121620] border border-gray-355 rounded-md py-1.5 pl-3 pr-8 w-48 focus:outline-none focus:border-emerald-500 transition-colors"
                                />
                                <div className="absolute right-2 top-1.5 text-gray-400"><Icon name="search" size={14} /></div>
                            </div>
                            
                            <div className="h-4 w-px bg-gray-300 dark:bg-gray-700"></div>

                            {/* Google Sign-in trigger */}
                            {user ? (
                                <div className="flex items-center gap-2">
                                    {user.photoURL ? (
                                        <img src={user.photoURL} alt={user.displayName} className="w-6 h-6 rounded-full border border-emerald-500 shadow-sm" />
                                    ) : (
                                        <div className="w-6 h-6 rounded-full bg-emerald-600 flex items-center justify-center text-white text-[9px] font-bold">
                                            {user.displayName ? user.displayName.substring(0, 2).toUpperCase() : "US"}
                                        </div>
                                    )}
                                    <div className="hidden sm:block text-right">
                                        <p className="text-[10px] font-bold leading-tight">{user.displayName || "User"}</p>
                                        <button 
                                            onClick={handleSignOut}
                                            className="text-[9px] text-rose-500 hover:text-rose-400 font-mono uppercase tracking-wider block"
                                        >
                                            Sign Out
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <button 
                                    onClick={handleSignIn}
                                    className="px-2.5 py-1.5 rounded border border-emerald-600/30 text-emerald-500 hover:bg-emerald-600/10 text-xs font-semibold flex items-center gap-1.5 transition-colors"
                                    title="Sign in with your Google account"
                                >
                                    <Icon name="google" size={12} />
                                    <span className="hidden sm:inline">Sign In</span>
                                </button>
                            )}

                            {/* Add custom token trigger */}
                            <button 
                                onClick={() => {
                                    setEditingColor(null);
                                    setNewName('');
                                    setNewPrimary('#');
                                    setNewSecondary('');
                                    setShowAddModal(true);
                                }}
                                className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold flex items-center gap-1 transition-colors"
                                title="Add custom reference color"
                            >
                                <Icon name="plus" size={12} />
                                <span>Add Color</span>
                            </button>

                            {/* Refresh sync trigger */}
                            <button 
                                onClick={loadDatabase}
                                className={`p-2 rounded-full hover:bg-gray-200 dark:hover:bg-white/5 text-gray-400 dark:text-gray-300 transition-colors ${syncing ? 'animate-spin' : ''}`}
                                title="Sync from Database"
                            >
                                <Icon name="refresh" size={14} />
                            </button>

                            {/* Database settings trigger */}
                            <button 
                                onClick={() => setShowDbModal(true)}
                                className={`p-2 rounded-full hover:bg-gray-200 dark:hover:bg-white/5 transition-colors text-xs font-semibold flex items-center gap-1 ${dbConfig.useMock ? 'text-gray-400' : 'text-emerald-500'}`}
                                title="Database Connection Configuration"
                            >
                                <Icon name="database" size={16} />
                            </button>

                            {/* Theme switcher */}
                            <button 
                                onClick={toggleTheme}
                                className="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-white/5 transition-colors"
                                aria-label="Toggle Dark Mode"
                            >
                                {isDark ? <Icon name="sun" size={16} /> : <Icon name="moon" size={16} />}
                            </button>
                        </div>
                    </header>

                    {/* MAIN WORKSPACE VIEW */}
                    <main className="max-w-7xl mx-auto px-6 pt-8 space-y-6">
                        
                        {/* Executive Summary Card */}
                        <div className="bg-white dark:bg-[#0E111A] rounded-xl p-6 shadow-sm border border-gray-200 dark:border-white/5 flex flex-col md:flex-row gap-6 justify-between items-start md:items-center">
                            <div className="max-w-2xl">
                                <h2 className="text-base font-bold mb-1.5 text-gray-900 dark:text-white">Interface Layout & Harmony Color Guide</h2>
                                <p className="text-xs text-gray-600 dark:text-gray-400 leading-relaxed">
                                    An exhaustive catalog mapping color elements to financial layouts. Click any card to copy. Press <kbd className="px-1.5 py-0.5 rounded border border-gray-300 dark:border-white/10 bg-gray-100 dark:bg-white/5 font-mono text-[10px]">Ctrl+N</kbd> to add a new color, and <kbd className="px-1.5 py-0.5 rounded border border-gray-300 dark:border-white/10 bg-gray-100 dark:bg-white/5 font-mono text-[10px]">Esc</kbd> to exit.
                                </p>
                            </div>
                            
                            <div className="flex flex-col items-end shrink-0 text-right">
                                <div className="text-2xl font-bold tracking-tighter text-gray-900 dark:text-white">{visibleCount} / {totalCount}</div>
                                <div className="text-[10px] font-mono uppercase tracking-widest text-gray-500">Gradients Displayed</div>
                            </div>
                        </div>

                        {/* SORT/GROUP SELECTOR & CATEGORIES BAR */}
                        <div className="flex flex-col md:flex-row md:items-center justify-between pb-3 border-b border-gray-255 dark:border-white/5 gap-4">
                            
                            {/* Dynamic Sort/Group selection tabs */}
                            <div className="flex flex-wrap gap-2 items-center">
                                <div className="flex gap-1 bg-gray-200 dark:bg-white/5 p-1 rounded-lg text-xs font-semibold">
                                    <button 
                                        onClick={() => setSortMode('LAYOUT')}
                                        className={`px-3 py-1.5 rounded-md transition-colors ${sortMode === 'LAYOUT' ? 'bg-white dark:bg-[#0E111A] text-gray-900 dark:text-white shadow-sm' : 'text-gray-500 hover:text-gray-800'}`}
                                    >
                                        UI Layout Locations
                                    </button>
                                    <button 
                                        onClick={() => setSortMode('HARMONIES')}
                                        className={`px-3 py-1.5 rounded-md transition-colors ${sortMode === 'HARMONIES' ? 'bg-white dark:bg-[#0E111A] text-gray-900 dark:text-white shadow-sm' : 'text-gray-500 hover:text-gray-800'}`}
                                    >
                                        Color Theory Harmonies
                                    </button>
                                </div>

                                {/* Chronological Sorting Toggles */}
                                <div className="flex items-center gap-1.5 text-xs font-semibold ml-2">
                                    <span className="text-gray-400">Sort cards:</span>
                                    <select 
                                        value={sortBy} 
                                        onChange={(e) => setSortBy(e.target.value)}
                                        className="bg-white dark:bg-[#121620] border border-gray-300 dark:border-white/5 rounded px-2.5 py-1.5 focus:outline-none focus:border-emerald-500 transition-colors"
                                    >
                                        <option value="NEW_TO_OLD">New to Old</option>
                                        <option value="OLD_TO_NEW">Old to New</option>
                                        <option value="NAME_ASC">Name (A-Z)</option>
                                        <option value="NAME_DESC">Name (Z-A)</option>
                                    </select>
                                </div>
                            </div>

                            <span className="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono self-end">
                                Grouping: {sortMode === 'LAYOUT' ? 'Dashboard Component Mapping' : 'Mathematical HSL Harmonization'}
                            </span>
                        </div>

                        {/* CATALOG GRID MATRIX */}
                        <div className="space-y-12">
                            {groupedColorData.map((group, idx) => (
                                <section key={idx} className="animate-fade-in">
                                    <div className="flex items-center gap-3 mb-4">
                                        <h3 className="text-xs font-extrabold uppercase tracking-wider text-emerald-500 font-mono">{group.group}</h3>
                                        <div className="h-px flex-1 bg-gradient-to-r from-gray-200 dark:from-white/10 to-transparent"></div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 animate-fade-in">
                                        {group.colors.map((color, cIdx) => (
                                            <ColorCard 
                                                key={color.id || cIdx} 
                                                color={color} 
                                                onDelete={handleDeleteColor}
                                                onEdit={handleEditClick}
                                            />
                                        ))}
                                    </div>
                                </section>
                            ))}
                            
                            {groupedColorData.length === 0 && (
                                <div className="text-center py-20 text-gray-500 dark:text-gray-400 text-sm">
                                    No colors found matching search criteria.
                                </div>
                            )}
                        </div>

                    </main>

                    {/* DYNAMIC FORM MODAL: ADD / EDIT COLOR */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                            <div className="bg-white dark:bg-[#0E111A] w-full max-w-sm rounded-xl border border-gray-200 dark:border-white/5 shadow-2xl p-6 text-xs text-gray-700 dark:text-gray-300">
                                <div className="flex justify-between items-center mb-4 border-b border-gray-200 dark:border-white/5 pb-2">
                                    <h3 className="text-sm font-bold text-gray-900 dark:text-white">
                                        {editingColor ? "Edit Color Reference" : "Create Custom Color"}
                                    </h3>
                                    <button 
                                        onClick={() => {
                                            setShowAddModal(false);
                                            setEditingColor(null);
                                        }} 
                                        className="text-lg font-bold hover:text-gray-900 dark:hover:text-white"
                                    >
                                        &times;
                                    </button>
                                </div>
                                <form onSubmit={handleSaveColor} className="space-y-4">
                                    <div>
                                        <label className="block font-semibold mb-1">Color Name</label>
                                        <input 
                                            type="text" 
                                            required 
                                            value={newName} 
                                            onChange={(e) => setNewName(e.target.value)} 
                                            placeholder="e.g. active link blue" 
                                            className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-350 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-semibold mb-1">Primary Color</label>
                                            <div className="flex gap-1 items-center">
                                                <input 
                                                    type="color" 
                                                    value={newPrimary.length === 7 ? newPrimary : "#000000"} 
                                                    onChange={(e) => handleHexInputChange(e.target.value, setNewPrimary, false)} 
                                                    className="w-8 h-8 rounded cursor-pointer border dark:border-white/5 p-0"
                                                />
                                                <input 
                                                    type="text" 
                                                    value={newPrimary} 
                                                    onChange={(e) => handleHexInputChange(e.target.value, setNewPrimary, false)} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-300 dark:border-white/5 rounded p-1 font-mono text-[10px]"
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block font-semibold mb-1">Secondary Color (Optional)</label>
                                            <div className="flex gap-1 items-center">
                                                <input 
                                                    type="color" 
                                                    value={newSecondary.length === 7 ? newSecondary : "#000000"} 
                                                    onChange={(e) => handleHexInputChange(e.target.value, setNewSecondary, true)} 
                                                    className="w-8 h-8 rounded cursor-pointer border dark:border-white/5 p-0"
                                                />
                                                <input 
                                                    type="text" 
                                                    value={newSecondary} 
                                                    placeholder="Blank for solid color"
                                                    onChange={(e) => handleHexInputChange(e.target.value, setNewSecondary, true)} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-350 dark:border-white/5 rounded p-1 font-mono text-[10px]"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="block font-semibold">Layout Section Group</label>
                                            {!editingColor && (
                                                <span className="text-[9px] text-emerald-500 font-bold font-mono">Auto-classified</span>
                                            )}
                                        </div>
                                        <select 
                                            value={newGroup} 
                                            onChange={(e) => setNewGroup(e.target.value)}
                                            className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-355 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none font-medium"
                                        >
                                            {Object.values(LAYOUT_GROUPS).map(gName => (
                                                <option key={gName} value={gName}>{gName}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* Preview Block */}
                                    <div 
                                        className="h-10 w-full rounded-lg border border-black/5 dark:border-white/10 flex items-center justify-center text-[10px] text-gray-400 font-mono" 
                                        style={{ background: getPreviewBg() }}
                                    >
                                        {(!newPrimary || newPrimary.length !== 7) && "Enter valid primary hex code..."}
                                    </div>

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => {
                                                setShowAddModal(false);
                                                setEditingColor(null);
                                            }}
                                            className="px-3 py-1.5 rounded bg-gray-200 dark:bg-gray-800 font-semibold"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-semibold"
                                        >
                                            {editingColor ? "Save Changes" : "Add Reference"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* DYNAMIC FORM MODAL: FIREBASE CONFIG */}
                    {showDbModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                            <div className="bg-white dark:bg-[#0E111A] w-full max-w-sm rounded-xl border border-gray-200 dark:border-white/5 shadow-2xl p-6 text-xs text-gray-700 dark:text-gray-300">
                                <div className="flex justify-between items-center mb-4 border-b border-gray-200 dark:border-white/5 pb-2">
                                    <h3 className="text-sm font-bold text-gray-900 dark:text-white">Firestore Database Settings</h3>
                                    <button onClick={() => setShowDbModal(false)} className="text-lg font-bold hover:text-gray-900 dark:hover:text-white">&times;</button>
                                </div>
                                <form onSubmit={handleSaveDb} className="space-y-4">
                                    <div className="flex items-center gap-2 p-2 bg-emerald-500/10 rounded border border-emerald-500/20">
                                        <input 
                                            type="checkbox" 
                                            id="mockMode"
                                            checked={dbConfig.useMock}
                                            onChange={(e) => setDbConfig({...dbConfig, useMock: e.target.checked})}
                                            className="w-4 h-4 accent-emerald-500"
                                        />
                                        <label htmlFor="mockMode" className="font-semibold select-none cursor-pointer">Use offline Sandbox Mode</label>
                                    </div>

                                    {!dbConfig.useMock && (
                                        <div className="space-y-3">
                                            <div>
                                                <label className="block font-semibold mb-1">Project ID</label>
                                                <input 
                                                    type="text" 
                                                    required 
                                                    value={dbConfig.projectId} 
                                                    onChange={(e) => setDbConfig({...dbConfig, projectId: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-350 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-semibold mb-1">API Key</label>
                                                <input 
                                                    type="password" 
                                                    required 
                                                    value={dbConfig.apiKey} 
                                                    onChange={(e) => setDbConfig({...dbConfig, apiKey: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-355 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-semibold mb-1">Auth Domain</label>
                                                <input 
                                                    type="text" 
                                                    value={dbConfig.authDomain} 
                                                    onChange={(e) => setDbConfig({...dbConfig, authDomain: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-300 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-semibold mb-1">Messaging Sender ID (Project Number)</label>
                                                <input 
                                                    type="text" 
                                                    value={dbConfig.messagingSenderId || ""} 
                                                    onChange={(e) => setDbConfig({...dbConfig, messagingSenderId: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-350 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-semibold mb-1">App ID</label>
                                                <input 
                                                    type="text" 
                                                    value={dbConfig.appId} 
                                                    onChange={(e) => setDbConfig({...dbConfig, appId: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-300 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowDbModal(false)}
                                            className="px-3 py-1.5 rounded bg-gray-200 dark:bg-gray-800 font-semibold"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-semibold"
                                        >
                                            Save Settings
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* TOAST SYSTEM */}
                    <div className="fixed bottom-6 right-6 z-50 space-y-2">
                        {toasts.map(toast => (
                            <div 
                                key={toast.id}
                                className={`flex items-center gap-3 px-4 py-3 rounded-lg border backdrop-blur-md shadow-premium animate-fade-in ${
                                    toast.type === 'success' ? "border-emerald-500 bg-emerald-950/80 text-emerald-300" :
                                    toast.type === 'error' ? "border-rose-500 bg-rose-950/80 text-rose-300" :
                                    "border-sky-500 bg-sky-950/80 text-sky-300"
                                }`}
                            >
                                <span className="text-xs font-semibold">{toast.message}</span>
                                <button onClick={() => removeToast(toast.id)} className="text-[10px] font-bold opacity-60 hover:opacity-100">&times;</button>
                            </div>
                        ))}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
