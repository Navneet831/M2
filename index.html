<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout & Harmony Color Matrix</title>
    
    <!-- Typography: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CDN Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

    <!-- Firebase Compat SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F0F2F5; color: #111827; overflow-x: hidden; transition: background-color 0.3s, color 0.3s; }
        .dark body { background-color: #05070C; color: #F3F4F6; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .color-card {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s, border-color 0.2s;
        }
        .color-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        .color-card:active { transform: translateY(0px) scale(0.98); }

        .toggle-icon { transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .toggle-icon.rotated { transform: rotate(180deg); }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // ==========================================
        // COLOR SYSTEM HELPER FUNCTIONS (HSL & WCAG)
        // ==========================================

        const hexToRgb = (hex) => {
            if (!hex || hex.length !== 7) return { r: 0, g: 0, b: 0 };
            let c = hex.substring(1);
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            return {
                r: parseInt(c.substring(0, 2), 16) || 0,
                g: parseInt(c.substring(2, 4), 16) || 0,
                b: parseInt(c.substring(4, 6), 16) || 0
            };
        };

        const rgbToHex = (r, g, b) => {
            const clamp = (val) => Math.max(0, Math.min(Math.round(val), 255));
            return "#" + [clamp(r), clamp(g), clamp(b)].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join("").toUpperCase();
        };

        const hexToHsl = (hex) => {
            const { r, g, b } = hexToRgb(hex);
            const rPercent = r / 255;
            const gPercent = g / 255;
            const bPercent = b / 255;

            const max = Math.max(rPercent, gPercent, bPercent);
            const min = Math.min(rPercent, gPercent, bPercent);
            let h = 0, s = 0, l = (max + min) / 2;

            if (max !== min) {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case rPercent: h = (gPercent - bPercent) / d + (gPercent < bPercent ? 6 : 0); break;
                    case gPercent: h = (bPercent - rPercent) / d + 2; break;
                    case bPercent: h = (rPercent - gPercent) / d + 4; break;
                }
                h /= 6;
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        };

        const getOptimalTextColor = (hex) => {
            if (!hex || hex.length !== 7) return '#FFFFFF';
            const rgb = hexToRgb(hex);
            const lum = getLuminance(rgb.r, rgb.g, rgb.b);
            const contrastWhite = (1 + 0.05) / (lum + 0.05);
            const contrastBlack = (lum + 0.05) / (0.015 + 0.05);
            return contrastWhite > contrastBlack ? '#FFFFFF' : '#111827';
        };

        const getLuminance = (r, g, b) => {
            const [rs, gs, bs] = [r/255, g/255, b/255].map(c => 
                c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
            );
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        };

        const getHarmonyCategory = (hex) => {
            const { h, s, l } = hexToHsl(hex);
            if (s < 10) return "Monochrome & Neutral tones";
            if (h >= 330 || h < 20) return "Complementary Red Harmonies";
            if (h >= 20 && h < 50) return "Analogous Orange & Gold tones";
            if (h >= 50 && h < 80) return "Analogous Yellow & Amber tones";
            if (h >= 80 && h < 165) return "Triadic Green & Mint harmonies";
            if (h >= 165 && h < 255) return "Complementary Blue & Cyan tones";
            return "Triadic Purple & Violet sets";
        };

        // --- ICONS ---
        const Icon = ({ name, size=20, className="" }) => {
            const icons = {
                'moon': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>,
                'sun': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>,
                'copy': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
                'check': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
                'database': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path></svg>,
                'plus': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
                'search': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
                'refresh': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>,
                'trash': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
                'edit': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
                'google': <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
            };
            return icons[name] || null;
        };

        const LAYOUT_GROUPS = {
            BG: "Background Colors",
            HDR: "Header Colors",
            SDB: "Sidebar Colors",
            FTR: "Footer Colors"
        };

        const classifyLayoutGroup = (hex) => {
            if (!hex || hex.length !== 7) return LAYOUT_GROUPS.BG;
            const { h, s, l } = hexToHsl(hex);
            if (l <= 15 || l >= 85) return LAYOUT_GROUPS.BG;
            if (s < 18) return LAYOUT_GROUPS.FTR;
            if (h >= 80 && h <= 260) return LAYOUT_GROUPS.HDR;
            return LAYOUT_GROUPS.SDB;
        };

        const DB_CONFIG_KEY = "aura_firebase_exhaustive_config";
        const OFFLINE_DB_KEY = "aura_local_exhaustive_ref";

        // ==========================================
        // MINIMAL COLOR CARD REFERENCE COMPONENT
        // ==========================================
        const ColorCard = ({ color, onDelete, onEdit }) => {
            const [copied, setCopied] = useState(false);
            const textColor = getOptimalTextColor(color.primary);

            const handleCopy = (e) => {
                e.stopPropagation();
                let copyVal = "";
                if (!color.secondary || color.secondary === color.primary) {
                    copyVal = color.primary;
                } else {
                    copyVal = `linear-gradient(135deg, ${color.primary}, ${color.secondary})`;
                }
                
                const el = document.createElement('textarea');
                el.value = copyVal;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);

                setCopied(true);
                setTimeout(() => setCopied(false), 1500);
            };

            const getCardBackground = () => {
                if (!color.secondary || color.secondary === color.primary) {
                    return color.primary;
                }
                return `linear-gradient(135deg, ${color.primary}, ${color.secondary})`;
            };

            return (
                <div 
                    onClick={handleCopy}
                    className="color-card group relative h-28 w-full rounded-xl cursor-pointer flex flex-col justify-between p-3 border border-black/5 dark:border-white/10"
                    style={{ background: getCardBackground(), color: textColor }}
                    role="button"
                    tabIndex={0}
                    aria-label={`Copy color definition for ${color.name}`}
                >
                    <div className="flex justify-between items-start w-full">
                        <span className="text-[11px] font-bold tracking-tight uppercase opacity-95 drop-shadow-sm leading-tight max-w-[80%]">
                            {color.name}
                        </span>
                        
                        <div className="flex items-center gap-1.5" onClick={(e) => e.stopPropagation()}>
                            {onEdit && (
                                <button 
                                    onClick={() => onEdit(color)}
                                    className="opacity-0 group-hover:opacity-100 transition-opacity bg-black/10 dark:bg-white/20 hover:bg-emerald-600/40 p-1 rounded backdrop-blur-sm"
                                    title="Edit reference"
                                >
                                    <Icon name="edit" size={12} />
                                </button>
                            )}
                            {onDelete && (
                                <button 
                                    onClick={() => onDelete(color.id)}
                                    className="opacity-0 group-hover:opacity-100 transition-opacity bg-black/10 dark:bg-white/20 hover:bg-red-600/40 p-1 rounded backdrop-blur-sm"
                                    title="Delete token"
                                >
                                    <Icon name="trash" size={12} />
                                </button>
                            )}
                            <div className="opacity-0 group-hover:opacity-100 transition-opacity bg-black/10 dark:bg-white/20 p-1 rounded backdrop-blur-sm">
                                {copied ? <Icon name="check" size={12} /> : <Icon name="copy" size={12} />}
                            </div>
                        </div>
                    </div>
                    
                    <div className="flex justify-between items-end w-full text-[10px] font-mono opacity-90 font-semibold tracking-wider">
                        <span>{color.primary}</span>
                        {color.secondary && color.secondary !== color.primary && (
                            <>
                                <span>➔</span>
                                <span>{color.secondary}</span>
                            </>
                        )}
                    </div>
                    
                    {copied && (
                        <div className="absolute inset-0 flex items-center justify-center bg-black/25 dark:bg-white/20 backdrop-blur-[2px] rounded-xl z-20">
                            <span className="font-bold text-xs tracking-widest uppercase">Copied</span>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // MAIN APPLICATION COMPONENT
        // ==========================================
        const App = () => {
            const [isDark, setIsDark] = useState(true);
            const [search, setSearch] = useState('');
            const [sortMode, setSortMode] = useState('LAYOUT'); // LAYOUT vs HARMONIES
            const [sortBy, setSortBy] = useState('NEW_TO_OLD'); // NEW_TO_OLD is the default
            const [colors, setColors] = useState([]);
            const [user, setUser] = useState(null);
            const [editingColor, setEditingColor] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            // Database Settings State
            const [dbConfig, setDbConfig] = useState(() => {
                const saved = localStorage.getItem(DB_CONFIG_KEY);
                return saved ? JSON.parse(saved) : { 
                    useMock: false, 
                    projectId: "analyticsdb-ac8c6", 
                    apiKey: "AIzaSyC5wffZqM4TeDRtOtSv-w3S4-Q-Xny218E", 
                    authDomain: "analyticsdb-ac8c6.firebaseapp.com", 
                    messagingSenderId: "352159716527",
                    appId: "1:352159716527:web:5c7f92350cec32c1d9f05a" 
                };
            });

            // UI dialog states
            const [showDbModal, setShowDbModal] = useState(false);
            const [showAddModal, setShowAddModal] = useState(false);
            const [syncing, setSyncing] = useState(false);

            // Add/Edit Form values
            const [newName, setNewName] = useState('');
            const [newPrimary, setNewPrimary] = useState('#'); // Initialize empty with only #
            const [newSecondary, setNewSecondary] = useState(''); // Empty string means solid color
            const [newGroup, setNewGroup] = useState(LAYOUT_GROUPS.BG);
            const [toasts, setToasts] = useState([]);

            // Keyboard shortcut Ctrl+N for adding colors and Escape key to close modals
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.ctrlKey && e.key.toLowerCase() === 'n') {
                        e.preventDefault(); // Prevents default new window action
                        setEditingColor(null);
                        setNewName('');
                        setNewPrimary('#');
                        setNewSecondary('');
                        setShowAddModal(true);
                    }
                    if (e.key === 'Escape') {
                        setShowAddModal(false);
                        setShowDbModal(false);
                        setEditingColor(null);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            // Auto-classify helper to pre-fill dropdown in UI
            useEffect(() => {
                if (newPrimary && newPrimary.length === 7 && !editingColor) {
                    const groupSuggestion = classifyLayoutGroup(newPrimary);
                    setNewGroup(groupSuggestion);
                }
            }, [newPrimary, editingColor]);

            const showToast = useCallback((message, type="info") => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3000);
            }, []);

            const removeToast = useCallback((id) => {
                setToasts(prev => prev.filter(t => t.id !== id));
            }, []);

            // Theme toggle
            const toggleTheme = () => {
                setIsDark(!isDark);
                if (!isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            };

            const isSandbox = useMemo(() => {
                return dbConfig.useMock || typeof firebase === 'undefined';
            }, [dbConfig.useMock]);

            // Firestore Database client (fails gracefully if Firebase script is blocked or offline)
            const firestoreDb = useMemo(() => {
                if (dbConfig.useMock || !dbConfig.projectId) return null;
                try {
                    if (typeof firebase === 'undefined') {
                        console.warn("Firebase SDK is not loaded. Sandbox mode is active.");
                        return null;
                    }
                    if (!firebase.apps.length) {
                        firebase.initializeApp(dbConfig);
                    }
                    return firebase.firestore();
                } catch (e) {
                    console.error("Firebase startup error:", e);
                    showToast("Firebase initialization failed.", "error");
                    return null;
                }
            }, [dbConfig, showToast]);

            // Auth State Listener
            useEffect(() => {
                if (typeof firebase !== 'undefined') {
                    try {
                        const unsubscribe = firebase.auth().onAuthStateChanged((u) => {
                            setUser(u);
                            setAuthLoading(false);
                            if (u) {
                                showToast(`Welcome back, ${u.displayName || "User"}!`, "success");
                            }
                        });
                        return unsubscribe;
                    } catch (e) {
                        console.error("Authentication observer error:", e);
                        setAuthLoading(false);
                    }
                } else {
                    setAuthLoading(false);
                }
            }, [firestoreDb, showToast]);

            // Database loaders (loads strictly from Firestore query or local Storage sandbox fallback)
            const loadDatabase = useCallback(async () => {
                setSyncing(true);

                if (firestoreDb && user) {
                    try {
                        const snapshot = await firestoreDb.collection("colors")
                            .where("userId", "==", user.uid)
                            .get();
                        const loaded = [];
                        snapshot.forEach(doc => {
                            loaded.push({ id: doc.id, ...doc.data() });
                        });
                        setColors(loaded);
                        showToast("Colors loaded from Cloud Database.", "success");
                    } catch (e) {
                        console.error("Firestore fetch error:", e);
                        showToast("Firestore query failed. Using sandbox fallback.", "error");
                        loadLocalDb();
                    }
                } else {
                    loadLocalDb();
                }
                setSyncing(false);
            }, [firestoreDb, user, showToast]);

            const loadLocalDb = () => {
                const raw = localStorage.getItem(OFFLINE_DB_KEY);
                if (raw) {
                    try {
                        setColors(JSON.parse(raw));
                    } catch (e) {
                        setColors([]);
                    }
                } else {
                    setColors([]);
                }
            };

            useEffect(() => {
                if (isSandbox || user) {
                    loadDatabase();
                }
            }, [user, isSandbox, loadDatabase]);

            // Authentication Handlers
            const handleSignIn = async () => {
                try {
                    if (typeof firebase === 'undefined') {
                        showToast("Firebase SDK not loaded.", "error");
                        return;
                    }
                    if (!firebase.apps.length) {
                        firebase.initializeApp(dbConfig);
                    }
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await firebase.auth().signInWithPopup(provider);
                } catch (e) {
                    console.error("Sign in error:", e);
                    showToast("Google Sign-In failed: " + e.message, "error");
                }
            };

            const handleSignOut = async () => {
                try {
                    if (typeof firebase !== 'undefined') {
                        await firebase.auth().signOut();
                        setUser(null);
                        setColors([]);
                        showToast("Signed out successfully.", "info");
                    }
                } catch (e) {
                    console.error("Sign out error:", e);
                    showToast("Sign out failed.", "error");
                }
            };

            // Format hex inputs to enforce # prefix and limit characters
            const handleHexInputChange = (val, setter, allowEmpty = false) => {
                let raw = val.trim();
                if (allowEmpty && raw === '') {
                    setter('');
                    return;
                }
                if (!raw.startsWith('#')) {
                    raw = '#' + raw;
                }
                const cleanPart = raw.substring(1).replace(/[^0-9a-fA-F]/g, '');
                setter('#' + cleanPart.substring(0, 6));
            };

            // Setup Color Editing
            const handleEditClick = (color) => {
                setEditingColor(color);
                setNewName(color.name);
                setNewPrimary(color.primary);
                setNewSecondary(color.secondary === color.primary ? '' : color.secondary);
                setNewGroup(color.group);
                setShowAddModal(true);
            };

            // Seeding function: fetches colors.json and commits them to the database
            const handleSeedDatabase = async () => {
                setSyncing(true);
                showToast("Fetching baseline colors guide from colors.json...", "info");
                try {
                    const response = await fetch('colors.json');
                    const seedList = await response.json();
                    
                    if (firestoreDb && user) {
                        showToast("Writing baseline colors to Firestore...", "info");
                        // Commit in batches of 100
                        const batchSize = 100;
                        for (let i = 0; i < seedList.length; i += batchSize) {
                            const batch = firestoreDb.batch();
                            const chunk = seedList.slice(i, i + batchSize);
                            chunk.forEach(color => {
                                const docRef = firestoreDb.collection("colors").doc(color.id + "_" + user.uid);
                                batch.set(docRef, {
                                    name: color.name,
                                    primary: color.primary,
                                    secondary: color.secondary,
                                    group: color.group,
                                    createdAt: color.createdAt,
                                    userId: user.uid,
                                    system: true
                                });
                            });
                            await batch.commit();
                        }
                        showToast("Cloud Database successfully seeded with 160 colors!", "success");
                    } else {
                        // Seed localStorage sandbox
                        const formattedList = seedList.map(c => ({
                            ...c,
                            userId: "sandbox"
                        }));
                        localStorage.setItem(OFFLINE_DB_KEY, JSON.stringify(formattedList));
                        showToast("Local sandbox database seeded with 160 colors!", "success");
                    }
                    loadDatabase();
                } catch (e) {
                    console.error("Seeding error:", e);
                    showToast("Failed to seed: ensure colors.json is present.", "error");
                }
                setSyncing(false);
            };

            // Color saving (supports both adding new and saving edits directly in the DB)
            const handleSaveColor = async (e) => {
                e.preventDefault();

                if (newPrimary.length !== 7) {
                    showToast("Please enter a valid 7-character primary color hex code.", "error");
                    return;
                }
                if (newSecondary && newSecondary.length !== 7) {
                    showToast("Please enter a valid 7-character secondary color hex code or clear it.", "error");
                    return;
                }

                const isDuplicate = colors.some(c => 
                    c.primary.toUpperCase() === newPrimary.toUpperCase() && 
                    (!editingColor || c.id !== editingColor.id)
                );
                if (isDuplicate) {
                    showToast("This color hex already exists. It must be unique.", "error");
                    return;
                }

                const finalGroup = newGroup || classifyLayoutGroup(newPrimary);

                if (editingColor) {
                    const updatedRef = {
                        ...editingColor,
                        name: newName,
                        primary: newPrimary,
                        secondary: newSecondary || newPrimary,
                        group: finalGroup,
                        createdAt: editingColor.createdAt || Date.now(), // Preserve timestamp
                        updatedAt: Date.now(),
                        userId: user ? user.uid : "sandbox"
                    };

                    if (firestoreDb && user) {
                        try {
                            await firestoreDb.collection("colors").doc(editingColor.id).set(updatedRef);
                            showToast("Color reference updated in Cloud Database.", "success");
                        } catch (err) {
                            updateLocal(updatedRef);
                            showToast("Updated locally.", "success");
                        }
                    } else {
                        updateLocal(updatedRef);
                        showToast("Updated locally.", "success");
                    }
                } else {
                    const newId = "color-" + Date.now();
                    const newRef = {
                        id: newId,
                        name: newName,
                        primary: newPrimary,
                        secondary: newSecondary || newPrimary,
                        group: finalGroup,
                        createdAt: Date.now(),
                        userId: user ? user.uid : "sandbox"
                    };

                    if (firestoreDb && user) {
                        try {
                            await firestoreDb.collection("colors").doc(newId).set(newRef);
                            showToast("Saved to Cloud Database.", "success");
                        } catch (err) {
                            saveLocal(newRef);
                            showToast("Failed to write to Cloud. Saved locally.", "error");
                        }
                    } else {
                        saveLocal(newRef);
                        showToast("Saved to local database.", "success");
                    }
                }

                setNewName('');
                setNewPrimary('#');
                setNewSecondary('');
                setEditingColor(null);
                setShowAddModal(false);
                loadDatabase();
            };

            const saveLocal = (ref) => {
                const raw = localStorage.getItem(OFFLINE_DB_KEY);
                const current = raw ? JSON.parse(raw) : [];
                current.push(ref);
                localStorage.setItem(OFFLINE_DB_KEY, JSON.stringify(current));
            };

            const updateLocal = (updatedRef) => {
                const raw = localStorage.getItem(OFFLINE_DB_KEY);
                if (raw) {
                    const current = JSON.parse(raw);
                    const idx = current.findIndex(c => c.id === updatedRef.id);
                    if (idx !== -1) {
                        current[idx] = updatedRef;
                        localStorage.setItem(OFFLINE_DB_KEY, JSON.stringify(current));
                    }
                }
            };

            const handleDeleteColor = async (id) => {
                if (firestoreDb && user) {
                    try {
                        await firestoreDb.collection("colors").doc(id).delete();
                        showToast("Deleted from Cloud Database.", "info");
                    } catch (e) {
                        console.error("Firestore delete failure:", e);
                        deleteLocal(id);
                        showToast("Deleted from local backup.", "info");
                    }
                } else {
                    deleteLocal(id);
                    showToast("Deleted from local database.", "info");
                }
                loadDatabase();
            };

            const deleteLocal = (id) => {
                const raw = localStorage.getItem(OFFLINE_DB_KEY);
                if (raw) {
                    const current = JSON.parse(raw);
                    const filtered = current.filter(c => c.id !== id);
                    localStorage.setItem(OFFLINE_DB_KEY, JSON.stringify(filtered));
                }
            };

            const handleSaveDb = (e) => {
                e.preventDefault();
                localStorage.setItem(DB_CONFIG_KEY, JSON.stringify(dbConfig));

            // Sorting, grouping, and filters
            const groupedColorData = useMemo(() => {
                let filtered = colors.filter(c => 
                    c.name.toLowerCase().includes(search.toLowerCase()) ||
                    c.primary.toLowerCase().includes(search.toLowerCase()) ||
                    (c.secondary && c.secondary.toLowerCase().includes(search.toLowerCase()))

                // Chronological & Alphabetical Sorting
                if (sortBy === 'NEW_TO_OLD') {
                    filtered.sort((a, b) => b.createdAt - a.createdAt);
                } else if (sortBy === 'OLD_TO_NEW') {
                    filtered.sort((a, b) => a.createdAt - b.createdAt);
                } else if (sortBy === 'NAME_ASC') {
                    filtered.sort((a, b) => a.name.localeCompare(b.name));
                } else if (sortBy === 'NAME_DESC') {
                    filtered.sort((a, b) => b.name.localeCompare(a.name));
                }

                if (sortMode === 'LAYOUT') {
                    const matrix = Object.values(LAYOUT_GROUPS).map(groupName => ({
                        group: groupName,
                        colors: []
                    }));

                    filtered.forEach(color => {
                        const match = matrix.find(m => m.group === color.group);
                        if (match) match.colors.push(color);
                    });

                    return matrix.filter(m => m.colors.length > 0);
                } else {
                    const harmonyMatrix = [
                        { group: "Complementary Red Harmonies", colors: [] },
                        { group: "Analogous Orange & Gold tones", colors: [] },
                        { group: "Analogous Yellow & Amber tones", colors: [] },
                        { group: "Triadic Green & Mint harmonies", colors: [] },
                        { group: "Complementary Blue & Cyan tones", colors: [] },
                        { group: "Triadic Purple & Violet sets", colors: [] },
                        { group: "Monochrome & Neutral tones", colors: [] }
                    ];

                    filtered.forEach(color => {
                        const category = getHarmonyCategory(color.primary);
                        const match = harmonyMatrix.find(h => h.group === category);
                        if (match) {
                            match.colors.push(color);
                        } else {
                            harmonyMatrix[harmonyMatrix.length - 1].colors.push(color);
                        }
                    });

                    return harmonyMatrix.filter(h => h.colors.length > 0);
                }
            }, [colors, search, sortMode, sortBy]);

            const visibleCount = groupedColorData.reduce((acc, s) => acc + s.colors.length, 0);

            // Check if preview background is ready
            const getPreviewBg = () => {
                const isValidPrimary = newPrimary && newPrimary.length === 7;
                const isValidSecondary = newSecondary && newSecondary.length === 7;

                                            <span>Sign In</span>

                        {/* COLD START / EMPTY STATE BANNER */}
                        {colors.length === 0 && (

                                <div className="text-gray-400 dark:text-gray-500 max-w-md mx-auto">

                    </main>

                    {/* DYNAMIC FORM MODAL: ADD / EDIT COLOR */}
                    {showAddModal && (

                                            <label className="block font-semibold">Layout Section Group</label>
                                            {!editingColor && (
                                                <span className="text-[9px] text-emerald-500 font-bold font-mono">Auto-classified</span>
                                            )}
                                        </div>
                                        <select 
                                            value={newGroup} 
                                            onChange={(e) => setNewGroup(e.target.value)}
                                            className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-355 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none font-medium text-black dark:text-white"
                                        >
                                            {Object.values(LAYOUT_GROUPS).map(gName => (
                                                <option key={gName} value={gName}>{gName}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* Preview Block */}
                                    <div 
                                        className="h-10 w-full rounded-lg border border-black/5 dark:border-white/10 flex items-center justify-center text-[10px] text-gray-400 font-mono" 
                                        style={{ background: getPreviewBg() }}
                                    >
                                        {(!newPrimary || newPrimary.length !== 7) && "Enter valid primary hex code..."}
                                    </div>

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => {
                                                setShowAddModal(false);
                                                setEditingColor(null);
                                            }}
                                            className="px-3 py-1.5 rounded bg-gray-200 dark:bg-gray-800 font-semibold"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-semibold"
                                        >
                                            {editingColor ? "Save Changes" : "Add Reference"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* DYNAMIC FORM MODAL: FIREBASE CONFIG */}
                    {showDbModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                            <div className="bg-white dark:bg-[#0E111A] w-full max-w-sm rounded-xl border border-gray-200 dark:border-white/5 shadow-2xl p-6 text-xs text-gray-700 dark:text-gray-300">
                                <div className="flex justify-between items-center mb-4 border-b border-gray-200 dark:border-white/5 pb-2">
                                    <h3 className="text-sm font-bold text-gray-900 dark:text-white">Firestore Database Settings</h3>
                                    <button onClick={() => setShowDbModal(false)} className="text-lg font-bold hover:text-gray-900 dark:hover:text-white">&times;</button>
                                </div>
                                <form onSubmit={handleSaveDb} className="space-y-4">
                                    <div className="flex items-center gap-2 p-2 bg-emerald-500/10 rounded border border-emerald-500/20">
                                        <input 
                                            type="checkbox" 
                                            id="mockMode"
                                            checked={dbConfig.useMock}
                                            onChange={(e) => setDbConfig({...dbConfig, useMock: e.target.checked})}
                                            className="w-4 h-4 accent-emerald-500"
                                        />
                                        <label htmlFor="mockMode" className="font-semibold select-none cursor-pointer">Use offline Sandbox Mode</label>
                                    </div>

                                    {!dbConfig.useMock && (
                                        <div className="space-y-3">
                                            <div>
                                                <label className="block font-semibold mb-1">Project ID</label>
                                                <input 
                                                    type="text" 
                                                    required 
                                                    value={dbConfig.projectId} 
                                                    onChange={(e) => setDbConfig({...dbConfig, projectId: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-355 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-semibold mb-1">API Key</label>
                                                <input 
                                                    type="password" 
                                                    required 
                                                    value={dbConfig.apiKey} 
                                                    onChange={(e) => setDbConfig({...dbConfig, apiKey: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-355 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-semibold mb-1">Auth Domain</label>
                                                <input 
                                                    type="text" 
                                                    value={dbConfig.authDomain} 
                                                    onChange={(e) => setDbConfig({...dbConfig, authDomain: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-300 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-semibold mb-1">Messaging Sender ID (Project Number)</label>
                                                <input 
                                                    type="text" 
                                                    value={dbConfig.messagingSenderId || ""} 
                                                    onChange={(e) => setDbConfig({...dbConfig, messagingSenderId: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-350 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-semibold mb-1">App ID</label>
                                                <input 
                                                    type="text" 
                                                    value={dbConfig.appId} 
                                                    onChange={(e) => setDbConfig({...dbConfig, appId: e.target.value})} 
                                                    className="w-full bg-gray-50 dark:bg-gray-955 border border-gray-300 dark:border-white/5 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowDbModal(false)}
                                            className="px-3 py-1.5 rounded bg-gray-200 dark:bg-gray-800 font-semibold"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-semibold"
                                        >
                                            Save Settings
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* TOAST SYSTEM */}
                    <div className="fixed bottom-6 right-6 z-50 space-y-2">
                        {toasts.map(toast => (
                            <div 
                                key={toast.id}
                                className={`flex items-center gap-3 px-4 py-3 rounded-lg border backdrop-blur-md shadow-premium animate-fade-in ${
                                    toast.type === 'success' ? "border-emerald-500 bg-emerald-950/80 text-emerald-300" :
                                    toast.type === 'error' ? "border-rose-500 bg-rose-950/80 text-rose-300" :
                                    "border-sky-500 bg-sky-950/80 text-sky-300"
                                }`}
                            >
                                <span className="text-xs font-semibold">{toast.message}</span>
                                <button onClick={() => removeToast(toast.id)} className="text-[10px] font-bold opacity-60 hover:opacity-100">&times;</button>
                            </div>
                        ))}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
